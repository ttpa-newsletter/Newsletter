<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Reset Admin Password | TTPA Multimedia Newsletter
    </title>

    <link rel="stylesheet"
          href="css/style.css">

    <style>

        .reset-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            box-sizing: border-box;
            background: #f5f8fb;
        }

        .reset-card {
            width: 100%;
            max-width: 460px;
            background: #ffffff;
            border: 1px solid #d9e3ec;
            border-radius: 14px;
            padding: 32px;
            box-sizing: border-box;
            box-shadow: 0 5px 18px rgba(0,0,0,0.08);
        }

        .reset-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .reset-header img {
            width: 82px;
            height: 82px;
            object-fit: contain;
            margin-bottom: 14px;
        }

        .reset-header h1 {
            margin: 0 0 8px;
            color: #173f68;
            font-size: 1.7rem;
        }

        .reset-header p {
            margin: 0;
            color: #666;
            line-height: 1.6;
        }

        .reset-form label {
            display: block;
            margin: 16px 0 7px;
            color: #173f68;
            font-weight: 600;
        }

        .reset-form input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px 14px;
            border: 1px solid #cbd5df;
            border-radius: 7px;
            font-size: 1rem;
        }

        .reset-form input:focus {
            outline: 2px solid #2f5d8c;
            outline-offset: 2px;
        }

        .reset-button {
            width: 100%;
            margin-top: 22px;
            padding: 13px 18px;
            border: 0;
            border-radius: 7px;
            background: #176b87;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
        }

        .reset-button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .reset-status {
            min-height: 24px;
            margin-top: 15px;
            text-align: center;
            line-height: 1.5;
        }

        .reset-status.error {
            color: #a61b1b;
        }

        .reset-status.success {
            color: #176b40;
        }

        .reset-links {
            margin-top: 24px;
            text-align: center;
        }

        .reset-links a {
            color: #173f68;
            text-decoration: none;
            font-weight: 600;
        }

        @media (max-width: 600px) {

            .reset-card {
                padding: 24px 20px;
            }

        }

    </style>

</head>


<body>


<main class="reset-page">

    <section class="reset-card">

        <div class="reset-header">

            <img
                src="images/ttpa-logo.png"
                alt="TTPA Logo">

            <h1>
                Set New Admin Password
            </h1>

            <p>
                Enter and confirm your new password for
                TTPA Newsletter administration.
            </p>

        </div>


        <form
            id="resetPasswordForm"
            class="reset-form">

            <label for="newPassword">
                New Password
            </label>

            <input
                type="password"
                id="newPassword"
                autocomplete="new-password"
                minlength="8"
                required>


            <label for="confirmPassword">
                Confirm New Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                autocomplete="new-password"
                minlength="8"
                required>


            <button
                type="submit"
                id="resetPasswordButton"
                class="reset-button">

                Update Password

            </button>


            <div
                id="resetPasswordStatus"
                class="reset-status"
                aria-live="polite">
            </div>

        </form>


        <div class="reset-links">

            <a href="admin.html">
                ← Back to Admin Login
            </a>

        </div>

    </section>

</main>


<script src="js/admin-reset-password.js"></script>

</body>

</html>
